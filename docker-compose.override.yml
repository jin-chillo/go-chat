services:
  # ==================== Application (개발 모드) ====================
  app:
    build:
      target: development
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - /app/tmp  # Air 빌드 디렉토리 제외
    environment:
      - GIN_MODE=debug
      - DATABASE_URL=postgres://gochat:gochat@postgres:5432/gochat?sslmode=disable
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=gochat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-key-do-not-use-in-production
    command: air
    # 개발 환경에서는 healthcheck 비활성화 (빠른 재시작)
    healthcheck:
      disable: true

  # ==================== 개발 도구: pgAdmin ====================
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gochat.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

  # ==================== 개발 도구: Mongo Express ====================
  mongo-express:
    image: mongo-express:latest
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    profiles:
      - tools

  # ==================== 개발 도구: Redis Commander ====================
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis
    profiles:
      - tools

volumes:
  go_mod_cache:
  go_build_cache:
  pgadmin_data:
